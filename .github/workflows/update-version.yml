name: Refresh Warp Version Badge

on:
  schedule:
    - cron: "0 */6 * * *" # Check every 6 hours
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  refresh-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # BYOB writes badge JSON to the shields branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Formula resolves the latest stable release at install/upgrade time.
      # This workflow only keeps the README version badge current.
      - name: Fetch Latest Warp Version
        id: warp_version
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          import re
          import urllib.request

          url = "https://releases.warp.dev/channel_versions.json"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Homebrew-silentglasses-warp",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              if resp.geturl().startswith("http://"):
                  raise SystemExit("refusing non-HTTPS metadata response")
              data = json.load(resp)

          version = data.get("stable", {}).get("version")
          if not version:
              raise SystemExit("Could not parse stable version")

          normalized = version[1:] if version.startswith("v") else version
          if not re.fullmatch(r"\d+(?:\.\d+)+\.stable_\d+", normalized):
              raise SystemExit(f"Unexpected version format: {version!r}")

          print(version)
          PY
          )

          echo "Latest stable version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Version Badge
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: warp-linux
          label: "Warp Version"
          status: ${{ steps.warp_version.outputs.version }}
          color: "446ca3"
          github_token: ${{ secrets.GITHUB_TOKEN }}
