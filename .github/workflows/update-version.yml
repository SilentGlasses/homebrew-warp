name: Autoupdate Warp

on:
  schedule:
    - cron: "0 */6 * * *" # Check every 6 hours
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: autoupdate-warp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Require AUTO_MERGE_TOKEN
        env:
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${AUTO_MERGE_TOKEN}" ]]; then
            echo "::error::AUTO_MERGE_TOKEN secret is missing. Set a classic PAT (repo scope) or fine-grained token with contents+pull_requests on this repo."
            exit 1
          fi
          # Fail fast on revoked/invalid tokens instead of cryptic checkout prompt errors.
          code=$(curl -sS -o /tmp/token-user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${AUTO_MERGE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)
          if [[ "$code" != "200" ]]; then
            echo "::error::AUTO_MERGE_TOKEN is invalid (HTTP ${code}). Rotate the secret."
            cat /tmp/token-user.json || true
            exit 1
          fi
          code=$(curl -sS -o /tmp/token-repo.json -w '%{http_code}' \
            -H "Authorization: Bearer ${AUTO_MERGE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          if [[ "$code" != "200" ]]; then
            echo "::error::AUTO_MERGE_TOKEN cannot read ${GITHUB_REPOSITORY} (HTTP ${code})."
            cat /tmp/token-repo.json || true
            exit 1
          fi
          login=$(python3 -c 'import json; print(json.load(open("/tmp/token-user.json"))["login"])')
          echo "ok: AUTO_MERGE_TOKEN authenticates as ${login}"

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # PAT required so opened bump PRs trigger required checks and can auto-merge.
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: Fetch Latest Warp Version
        id: warp_version
        run: |
          eval "$(python3 - <<'PY'
          import json
          import re
          import urllib.request

          url = "https://releases.warp.dev/channel_versions.json"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Homebrew-silentglasses-warp",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              final = resp.geturl()
              if not final.startswith("https://releases.warp.dev/"):
                  raise SystemExit(f"refusing metadata host redirect: {final}")
              data = json.load(resp)

          raw = data.get("stable", {}).get("version")
          if not raw:
              raise SystemExit("Could not parse stable.version")

          normalized = raw[1:] if raw.startswith("v") else raw
          if not re.fullmatch(r"\d+(?:\.\d+)+\.stable_\d+", normalized):
              raise SystemExit(f"Unexpected version format: {raw!r}")

          print(f"export RAW_VERSION={raw}")
          print(f"export VERSION={normalized}")
          PY
          )"

          echo "Latest stable version: $VERSION (raw $RAW_VERSION)"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if Update is Needed
        id: check
        run: |
          VERSION="${{ steps.warp_version.outputs.version }}"
          CURRENT=$(grep -oP '(?<=^  version ")[^"]+' Formula/warp-terminal.rb | head -1 || true)

          echo "Current formula version : ${CURRENT:-unknown}"
          echo "Latest upstream version : $VERSION"

          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Formula is already up to date."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update required."
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch AppImages and Compute SHA256
        id: warp_data
        if: steps.check.outputs.needs_update == 'true'
        run: |
          RAW="${{ steps.warp_version.outputs.raw_version }}"
          BASE_URL="https://releases.warp.dev/stable/${RAW}"
          URL_X86="${BASE_URL}/Warp-x86_64.AppImage"
          URL_ARM="${BASE_URL}/Warp-aarch64.AppImage"

          echo "Downloading x86_64 AppImage..."
          SHA256_X86=$(curl -fsSL -A "Homebrew-silentglasses-warp" "$URL_X86" | sha256sum | awk '{print $1}')
          [ -n "$SHA256_X86" ] || { echo "::error::SHA256 failed for x86_64"; exit 1; }

          echo "Downloading aarch64 AppImage..."
          SHA256_ARM=$(curl -fsSL -A "Homebrew-silentglasses-warp" "$URL_ARM" | sha256sum | awk '{print $1}')
          [ -n "$SHA256_ARM" ] || { echo "::error::SHA256 failed for aarch64"; exit 1; }

          echo "x86_64  sha256: $SHA256_X86"
          echo "aarch64 sha256: $SHA256_ARM"

          {
            echo "sha256_x86=$SHA256_X86"
            echo "sha256_arm=$SHA256_ARM"
            echo "url_x86=$URL_X86"
            echo "url_arm=$URL_ARM"
          } >> "$GITHUB_OUTPUT"

      - name: Update Formula
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.warp_version.outputs.version }}"
          X86_SHA="${{ steps.warp_data.outputs.sha256_x86 }}"
          ARM_SHA="${{ steps.warp_data.outputs.sha256_arm }}"

          sed -i -E "s/^(  version \")[^\"]+(\")/\1${VERSION}\2/" Formula/warp-terminal.rb
          sed -i "s|sha256 \".*\" # x86_64_sha256|sha256 \"${X86_SHA}\" # x86_64_sha256|" Formula/warp-terminal.rb
          sed -i "s|sha256 \".*\" # arm64_sha256|sha256 \"${ARM_SHA}\" # arm64_sha256|" Formula/warp-terminal.rb

          echo "Formula patched. Diff:"
          git diff Formula/warp-terminal.rb

          grep -q "version \"${VERSION}\"" Formula/warp-terminal.rb
          grep -q "sha256 \"${X86_SHA}\" # x86_64_sha256" Formula/warp-terminal.rb
          grep -q "sha256 \"${ARM_SHA}\" # arm64_sha256" Formula/warp-terminal.rb
          ruby -c Formula/warp-terminal.rb
          ./scripts/validate-formula-security.sh
          ./scripts/verify-appimage-pins.sh

      - name: Commit and Push to Feature Branch
        if: steps.check.outputs.needs_update == 'true'
        id: git_push
        run: |
          VERSION="${{ steps.warp_version.outputs.version }}"
          BRANCH="chore/bump-warp-v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add Formula/warp-terminal.rb

          if git diff --cached --quiet; then
            echo "Nothing changed after patching, skipping commit."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./scripts/validate-formula-security.sh origin/main

          git commit -m "chore(automation): bump warp-terminal to ${VERSION}"
          git push --force-with-lease origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open Pull Request and Enable Auto-Merge
        if: steps.check.outputs.needs_update == 'true' && steps.git_push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          VERSION="${{ steps.warp_version.outputs.version }}"
          BRANCH="${{ steps.git_push.outputs.branch }}"
          X86_SHA="${{ steps.warp_data.outputs.sha256_x86 }}"
          ARM_SHA="${{ steps.warp_data.outputs.sha256_arm }}"

          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already exists for branch ${BRANCH}"
            PR_NUMBER="$EXISTING"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(automation): bump warp-terminal to ${VERSION}" \
              --body "$(cat <<BODY
          Automated version bump for \`warp-terminal\` to \`${VERSION}\`.

          **Changes**
          - Pinned \`version\` → \`${VERSION}\`
          - Updated x86_64 SHA256 → \`${X86_SHA}\`
          - Updated aarch64 SHA256 → \`${ARM_SHA}\`

          Downloads verified from \`releases.warp.dev\` over HTTPS before the formula was patched.
          CI enforces a pin-only diff allowlist (version + sha256 anchors) and re-downloads AppImages to confirm pins.

          > Opened automatically by the Autoupdate Warp workflow.
          > Auto-merge waits for required status checks when repository settings allow it.
          BODY
          )")
            echo "Created $PR_URL"
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
          fi

          if gh pr merge "$PR_NUMBER" --squash --delete-branch --auto; then
            echo "Auto-merge enabled for PR #${PR_NUMBER}"
          else
            echo "::error::Could not enable auto-merge for PR #${PR_NUMBER}. Check: Allow auto-merge, required checks, and AUTO_MERGE_TOKEN scopes (repo)."
            exit 1
          fi

      # No third-party badge action: update a public gist consumed by shields.io.
      - name: Update Version Badge (gist + shields.io)
        if: always() && steps.warp_version.outputs.version != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          VERSION: ${{ steps.warp_version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${GIST_TOKEN}" || -z "${GIST_ID}" ]]; then
            echo "::warning::GIST_TOKEN/GIST_ID not set; skipping badge update"
            exit 0
          fi
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "description": "SilentGlasses/homebrew-warp version badge (shields.io endpoint)",
            "files": {
              "warp-version.json": {
                "content": json.dumps({
                  "schemaVersion": 1,
                  "label": "Warp Version",
                  "message": os.environ["VERSION"],
                  "color": "446ca3",
                }, indent=2) + "\n"
              }
            }
          }))
          PY
          )
          code=$(curl -sS -o /tmp/gist-patch.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            "https://api.github.com/gists/${GIST_ID}")
          if [[ "$code" != "200" ]]; then
            echo "::warning::badge gist update failed (HTTP ${code})"
            cat /tmp/gist-patch.json || true
            exit 0
          fi
          echo "ok: updated gist ${GIST_ID} badge message=${VERSION}"
