name: Test Formula

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
  pull_request:
    branches: [main]
    paths:
      - "Formula/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check Ruby syntax
        run: ruby -c Formula/warp-terminal.rb

      # Skip style cops: dynamic `version stable_version || "latest"` trips
      # FormulaAudit/Version ("empty string") even though runtime resolution works.
      - name: Audit formula
        run: brew audit --skip-style silentglasses/warp/warp-terminal

      - name: Validate formula loads without errors
        run: brew readall --no-simulate silentglasses/warp

      - name: Resolve current stable version via formula
        run: |
          brew info --json=v1 silentglasses/warp/warp-terminal \
            | python3 -c 'import json,sys,re; d=json.load(sys.stdin)[0]; v=d["versions"]["stable"]; u=d["urls"]["stable"]["url"]; print(v); print(u); assert re.fullmatch(r"\d+(?:\.\d+)+\.stable_\d+", v), v; assert u.startswith("https://releases.warp.dev/stable/v"), u; assert "AppImage" in u'
